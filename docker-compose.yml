# API + UI in containers; Ollama runs on the host (start it with OLLAMA_HOST=0.0.0.0)
# and the existing Chroma index is mounted from ./chroma_store.
# Never run ingestion in the container: build_vectorstore() deletes CHROMA_DIR.
services:
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_DIR=/app/chroma_store
    volumes:
      # Read-write: Chroma writes lock files even when only querying.
      - ./chroma_store:/app/chroma_store
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
