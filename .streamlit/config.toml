[theme]
base = "light"
primaryColor = "#3A0CA3"
backgroundColor = "#EAEBF3"
secondaryBackgroundColor = "#F8F9FD"
textColor = "#1A1735"
# Loaded by Streamlit as <link> stylesheets in <head> (an @import inside an
# injected <style> is not reliable). headingFont makes Fraunces available to
# the .tk-title / .tk-hero-title CSS classes.
font = "'Hanken Grotesk':https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap, serif"
